<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vikki Video AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font-family:Inter,system-ui,Arial}
.app{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font-weight:800;font-size:22px}.badge{font-size:12px;color:#a1a1aa;border:1px solid #27272a;padding:6px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.card{background:#111113;border:1px solid #27272a;border-radius:18px;padding:18px}
label{display:block;color:#a1a1aa;font-size:13px;margin:12px 0 7px}
textarea,input,select{width:100%;background:#09090b;color:#fff;border:1px solid #3f3f46;border-radius:11px;padding:12px;font:inherit}
textarea{min-height:130px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:11px;padding:13px 16px;font-weight:700;cursor:pointer}
.primary{width:100%;background:#fff;color:#09090b;margin-top:15px}.secondary{background:#27272a;color:#fff}
.upload{border:1px dashed #52525b;padding:18px;border-radius:12px;text-align:center;color:#a1a1aa}
.preview{aspect-ratio:16/9;background:#050505;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#71717a;overflow:hidden}
.preview video{width:100%;height:100%;object-fit:contain}.status{margin-top:10px;color:#a1a1aa;font-size:13px;white-space:pre-wrap}
@media(max-width:800px){.grid{grid-template-columns:1fr}.app{padding:12px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">Vikki Video AI</div><div class="badge">Free / Open Model</div></div>
<div class="grid">
<section class="card">
<h2>Generate video</h2>
<label>Prompt</label>
<textarea id="prompt" placeholder="A cinematic shot of a young man walking through a rainy city at night, natural movement, realistic skin, handheld camera..."></textarea>

<label>Reference image (optional)</label>
<div class="upload"><input id="image" type="file" accept="image/*"></div>

<div class="row">
<div><label>Mode</label><select id="mode"><option value="ti2v">Text / Image → Video</option><option value="t2v">Text → Video</option></select></div>
<div><label>Aspect ratio</label><select id="ratio"><option value="704*1280">9:16 Portrait</option><option value="1280*704">16:9 Landscape</option></select></div>
</div>
<div class="row">
<div><label>Duration</label><select id="duration"><option value="5">5 seconds</option><option value="10">10 seconds</option></select></div>
<div><label>Quality</label><select id="quality"><option value="720p">720p</option><option value="480p">480p</option></select></div>
</div>
<button class="primary" onclick="generate()">Generate Video</button>
<div id="status" class="status">Ready.</div>
</section>

<section class="card">
<h3>Preview</h3>
<div class="preview" id="preview">Your generated video will appear here</div>
<label>Result</label>
<button class="secondary" id="download" style="width:100%" disabled>Download MP4</button>
<hr style="border:0;border-top:1px solid #27272a;margin:20px 0">
<div style="color:#a1a1aa;font-size:13px;line-height:1.6">
<b style="color:#fff">Engine:</b> Wan2.2 TI2V-5B<br>
Text-to-video + image-to-video<br>
720p / 24 FPS capable<br>
Local GPU inference
</div>
</section>
</div>
</div>

<script>
let resultUrl=null;
async function generate(){
 const prompt=document.getElementById('prompt').value.trim();
 if(!prompt){alert('Prompt likho.');return}
 const fd=new FormData();
 fd.append('prompt',prompt);
 fd.append('mode',document.getElementById('mode').value);
 fd.append('ratio',document.getElementById('ratio').value);
 fd.append('duration',document.getElementById('duration').value);
 fd.append('quality',document.getElementById('quality').value);
 const f=document.getElementById('image').files[0];
 if(f) fd.append('image',f);
 const status=document.getElementById('status');
 status.textContent='Generating... GPU par model run ho raha hai. Isme kuch minutes lag sakte hain.';
 document.getElementById('download').disabled=true;
 try{
   const r=await fetch('/api/generate',{method:'POST',body:fd});
   const data=await r.json();
   if(!r.ok) throw new Error(data.detail||'Generation failed');
   resultUrl=data.video_url;
   document.getElementById('preview').innerHTML=`<video controls autoplay src="${resultUrl}"></video>`;
   const d=document.getElementById('download'); d.disabled=false;
   d.onclick=()=>{const a=document.createElement('a');a.href=resultUrl;a.download='vikki-ai-video.mp4';a.click()};
   status.textContent='Done.';
 }catch(e){status.textContent='Error: '+e.message}
}
</script>
</body>
</html>
